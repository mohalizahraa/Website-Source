name: temp-snazzy-storyboards
on:
  push:
    paths:
      - '.github/workflows/temp-snazzy-storyboards.yml'

jobs:
  recover-storyboards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch public Invidious video metadata and storyboard sheets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery
          IDS=('rg2Jqbj82Vk' '-dbuBNSwoGU')
          INSTANCES=(
            'https://invidious.tiekoetter.com'
            'https://inv.nadeko.net'
            'https://yt.chocolatemoo53.com'
            'https://invidious.nerdvpn.de'
          )
          for ID in "${IDS[@]}"; do
            mkdir -p "recovery/$ID"
            OK=''
            for BASE in "${INSTANCES[@]}"; do
              echo "Trying $BASE for $ID" | tee -a "recovery/$ID/access.log"
              if curl -fLsS --max-time 30 "$BASE/api/v1/videos/$ID" -o "recovery/$ID/video.json"; then
                OK="$BASE"
                break
              fi
            done
            if [ -z "$OK" ]; then
              echo "No public instance returned metadata" >> "recovery/$ID/access.log"
              continue
            fi
            ID_ENV="$ID" python - <<'PY'
          import json, os, urllib.request
          vid=os.environ['ID_ENV']
          base=f'recovery/{vid}'
          with open(f'{base}/video.json','r',encoding='utf-8') as f:
              data=json.load(f)
          summary={k:data.get(k) for k in ('title','videoId','lengthSeconds','author','publishedText')}
          summary['storyboards']=data.get('storyboards',[])
          with open(f'{base}/summary.json','w',encoding='utf-8') as f:
              json.dump(summary,f,indent=2,ensure_ascii=False)
          for i,sb in enumerate(data.get('storyboards') or []):
              url=sb.get('url') or sb.get('templateUrl')
              if not url:
                  continue
              url=url.replace('$N','0').replace('$L',str(i))
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=30) as r:
                      blob=r.read()
                  ext='.jpg' if b'JFIF' in blob[:20] or blob[:2]==b'\xff\xd8' else '.bin'
                  with open(f'{base}/storyboard-{i}{ext}','wb') as f:
                      f.write(blob)
              except Exception as e:
                  with open(f'{base}/storyboard-errors.log','a',encoding='utf-8') as f:
                      f.write(f'{i}: {url}: {e}\n')
          PY
          done
      - name: Inventory
        shell: bash
        run: find recovery -type f -printf '%p %s bytes\n' | sort | tee recovery/INVENTORY.txt
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: snazzy-storyboards
          path: recovery
          retention-days: 1
