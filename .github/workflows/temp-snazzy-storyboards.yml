name: temp-snazzy-storyboards
on:
  push:
    paths:
      - '.github/workflows/temp-snazzy-storyboards.yml'

jobs:
  recover-storyboards:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install current yt-dlp + public PO-token provider
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -U 'yt-dlp[default]' bgutil-ytdlp-pot-provider
          git clone --depth 1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git /tmp/bgutil
          cd /tmp/bgutil/server
          npm ci --silent
          npx tsc
          yt-dlp --version
      - name: Fetch exact YouTube storyboard formats only
        shell: bash
        run: |
          set +e
          mkdir -p recovery
          for ID in rg2Jqbj82Vk -dbuBNSwoGU; do
            OUT="recovery/$ID"
            mkdir -p "$OUT"
            URL="https://www.youtube.com/watch?v=$ID"
            echo "=== $ID ===" > "$OUT/log.txt"
            TOKEN_TTL=1 yt-dlp -v \
              --remote-components ejs:github \
              --js-runtimes node \
              --extractor-args "youtube:player_client=mweb;formats=missing_pot" \
              --extractor-args "youtubepot-bgutilscript:server_home=/tmp/bgutil/server" \
              -F "$URL" >> "$OUT/log.txt" 2>&1

            # Storyboard formats are image sheets generated by YouTube itself.
            TOKEN_TTL=1 yt-dlp -v \
              --remote-components ejs:github \
              --js-runtimes node \
              --extractor-args "youtube:player_client=mweb;formats=missing_pot" \
              --extractor-args "youtubepot-bgutilscript:server_home=/tmp/bgutil/server" \
              -f 'sb2/sb1/sb0' \
              -o "$OUT/storyboard.%(ext)s" "$URL" >> "$OUT/log.txt" 2>&1
            ls -lah "$OUT" >> "$OUT/log.txt" 2>&1
          done
      - name: Inventory
        shell: bash
        run: |
          find recovery -type f -printf '%p %s bytes\n' | sort | tee recovery/INVENTORY.txt
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: snazzy-pot-storyboards
          path: recovery
          retention-days: 1
