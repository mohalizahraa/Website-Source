name: temp-snazzy-archive-recovery
on:
  push:
    paths:
      - '.github/workflows/temp-snazzy-storyboards.yml'

jobs:
  archive-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Query Wayback indexes for exact watch pages and storyboard assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery
          python - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error

          IDS=['rg2Jqbj82Vk','-dbuBNSwoGU']
          UA={'User-Agent':'Mozilla/5.0 research archival lookup'}

          def fetch(url, timeout=45):
              req=urllib.request.Request(url,headers=UA)
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:
                      return r.status, r.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.read()
              except Exception as e:
                  return 0, repr(e).encode()

          for vid in IDS:
              d=f'recovery/{vid}'
              os.makedirs(f'{d}/assets',exist_ok=True)
              targets={
                  'watch':'https://www.youtube.com/watch?v='+vid,
                  'short':'https://youtu.be/'+vid,
                  'storyboard_prefix':'https://i.ytimg.com/sb/'+vid+'/'
              }
              results={}
              for name,target in targets.items():
                  if name=='storyboard_prefix':
                      params={
                          'url':target+'*','matchType':'prefix','output':'json',
                          'fl':'timestamp,original,statuscode,mimetype,digest,length',
                          'filter':'statuscode:200','limit':'200'
                      }
                      api='https://web.archive.org/cdx/search/cdx?'+urllib.parse.urlencode(params)
                  else:
                      params={
                          'url':target,'output':'json',
                          'fl':'timestamp,original,statuscode,mimetype,digest,length',
                          'filter':'statuscode:200','limit':'50'
                      }
                      api='https://web.archive.org/cdx/search/cdx?'+urllib.parse.urlencode(params)
                  status,body=fetch(api)
                  open(f'{d}/{name}-cdx.bin','wb').write(body)
                  results[name]={'http':status,'api':api,'bytes':len(body)}

              # Also query the simpler availability endpoint for the watch URL.
              avail='https://archive.org/wayback/available?'+urllib.parse.urlencode({'url':targets['watch']})
              status,body=fetch(avail)
              open(f'{d}/available.json','wb').write(body)
              results['available']={'http':status,'bytes':len(body)}

              # If storyboard CDX returned rows, recover each distinct captured image via id_ replay.
              sb_path=f'{d}/storyboard_prefix-cdx.bin'
              try:
                  rows=json.loads(open(sb_path,'rb').read())
              except Exception:
                  rows=[]
              if isinstance(rows,list) and len(rows)>1:
                  headers=rows[0]
                  seen=set()
                  for i,row in enumerate(rows[1:]):
                      rec=dict(zip(headers,row))
                      original=rec.get('original')
                      ts=rec.get('timestamp')
                      digest=rec.get('digest')
                      if not original or not ts or digest in seen: continue
                      seen.add(digest)
                      replay=f'https://web.archive.org/web/{ts}id_/{original}'
                      st,blob=fetch(replay)
                      ext='.jpg' if blob[:2]==b'\xff\xd8' else '.bin'
                      open(f'{d}/assets/{i:03d}{ext}','wb').write(blob)
                      results.setdefault('asset_fetches',[]).append({'http':st,'bytes':len(blob),'original':original,'timestamp':ts,'file':f'{i:03d}{ext}'})
              open(f'{d}/summary.json','w',encoding='utf-8').write(json.dumps(results,indent=2))
          PY
      - name: Inventory
        shell: bash
        run: |
          find recovery -type f -printf '%p %s bytes\n' | sort | tee recovery/INVENTORY.txt
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: snazzy-wayback-recovery
          path: recovery
          retention-days: 1
