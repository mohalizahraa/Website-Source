name: temp-snazzy-storyboards
on:
  push:
    paths:
      - '.github/workflows/temp-snazzy-storyboards.yml'

jobs:
  recover-visuals:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Recover via public Piped stream API
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery
          IDS=('rg2Jqbj82Vk' '-dbuBNSwoGU')
          APIS=(
            'https://pipedapi.kavin.rocks'
            'https://pipedapi.leptons.xyz'
            'https://pipedapi.nosebs.ru'
            'https://api-piped.mha.fi'
            'https://piped-api.garudalinux.org'
          )
          for ID in "${IDS[@]}"; do
            mkdir -p "recovery/$ID"
            OK=''
            for BASE in "${APIS[@]}"; do
              echo "Trying $BASE for $ID" | tee -a "recovery/$ID/access.log"
              CODE=$(curl -LsS --max-time 45 -w '%{http_code}' "$BASE/streams/$ID" -o "recovery/$ID/piped.json" || true)
              echo "HTTP $CODE" | tee -a "recovery/$ID/access.log"
              if [ "$CODE" = '200' ] && python -c "import json; d=json.load(open('recovery/$ID/piped.json')); assert d.get('videoStreams')" 2>/dev/null; then
                OK="$BASE"
                break
              fi
            done
            if [ -z "$OK" ]; then
              echo "No Piped API returned usable video streams" >> "recovery/$ID/access.log"
              continue
            fi

            ID_ENV="$ID" python - <<'PY'
          import json, os
          vid=os.environ['ID_ENV']
          p=f'recovery/{vid}/piped.json'
          d=json.load(open(p,encoding='utf-8'))
          streams=d.get('videoStreams') or []
          # Prefer 360-480p; video-only is fine because we only need frames.
          def rank(s):
              h=s.get('height') or 0
              target_penalty=0 if 360 <= h <= 480 else min(abs(h-360),abs(h-480))+1000
              return (target_penalty, abs(h-480), 1 if not s.get('url') else 0)
          streams=sorted(streams,key=rank)
          chosen=streams[0]
          summary={
              'title':d.get('title'),'duration':d.get('duration'),'uploader':d.get('uploader'),
              'uploadDate':d.get('uploadDate'),'thumbnailUrl':d.get('thumbnailUrl'),
              'chosenStream':{k:chosen.get(k) for k in ('quality','height','width','fps','format','mimeType','videoOnly','url')}
          }
          json.dump(summary,open(f'recovery/{vid}/summary.json','w',encoding='utf-8'),indent=2,ensure_ascii=False)
          open(f'recovery/{vid}/stream.url','w').write(chosen['url'])
          PY

            URL=$(cat "recovery/$ID/stream.url")
            mkdir -p "recovery/$ID/sheets"
            # Sample one frame every 10 seconds, 25 frames per contact sheet.
            ffmpeg -hide_banner -loglevel warning -y -i "$URL" \
              -vf "fps=1/10,scale=640:-2,tile=5x5:padding=2:margin=2" \
              -q:v 4 "recovery/$ID/sheets/sheet-%03d.jpg" \
              >"recovery/$ID/ffmpeg.out" 2>"recovery/$ID/ffmpeg.err" || true
            rm -f "recovery/$ID/stream.url"
          done
      - name: Inventory
        shell: bash
        run: find recovery -type f -printf '%p %s bytes\n' | sort | tee recovery/INVENTORY.txt
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: snazzy-visual-samples
          path: recovery
          retention-days: 1
