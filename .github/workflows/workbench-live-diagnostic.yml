name: Workbench live diagnostic

on:
  push:
    branches:
      - workbench
    paths:
      - .github/workflows/workbench-live-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Probe live Workbench APIs
        shell: bash
        run: |
          set -euo pipefail
          base='https://haydari-translation-workbench.pages.dev'
          for path in /api/health /api/projects; do
            echo "=== $path ==="
            tmp="$(mktemp)"
            code="$(curl -sS -o "$tmp" -w '%{http_code}' --max-time 20 "$base$path" || true)"
            echo "HTTP $code"
            head -c 2000 "$tmp" || true
            echo
            rm -f "$tmp"
          done
