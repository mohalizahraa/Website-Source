name: Hajj Workbench checkpoint notes (one-time)
on:
  push:
    branches: [workbench]
    paths:
      - .github/workflows/hajj-workbench-checkpoint-once.yml
permissions:
  contents: read
jobs:
  update-hajj-notes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Append verified editor checkpoint to existing project 11
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request
          url = "https://haydari-translation-workbench.pages.dev/api/projects/11"
          marker = "[2026-10-08 HAJJ DOC VERIFICATION CHECKPOINT]"
          reqget=urllib.request.Request(url,headers={"user-agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/125.0.0.0 Safari/537.36","accept":"application/json","referer":"https://haydari-translation-workbench.pages.dev/"})
          try:
              with urllib.request.urlopen(reqget, timeout=20) as resp:
                  project=json.load(resp)["project"]
          except urllib.error.HTTPError as ex:
              print("WORKBENCH_GET_HTTP_ERROR",ex.code,ex.headers,ex.read(800).decode("utf-8",errors="replace"))
              raise
          if project.get("id") != 11:
              raise RuntimeError("Wrong project ID; refusing to write")
          if project.get("google_doc_url", "").find("175AdOpqDeN1ul2PStNR_-QWLgjOM4VxesOukEBobjSI")<0:
              raise RuntimeError("Unexpected English Doc; refusing to write")
          if project.get("status") != "in_progress" or project.get("translated_pages") != 230 or project.get("pages") != 298:
              raise RuntimeError("Live progress/status changed; refresh, do not overwrite")
          original=project.get("notes") or ""
          if marker in original:
              print("Checkpoint already present; no duplicate")
          else:
              addition=(
                  marker + " Existing Rites of Hajj English Doc now includes the formerly missing post-farewell "
                  "Medina counsel, compiler conclusion, dated attribution, and the 2012 printed publisher "
                  "catalogue numbered 1–115; a previously omitted transition after Imam al-Husayn's "
                  "Arafah supplication was also restored. These new passages remain pending complete "
                  "page-by-page Arabic-source collation. Four native source note additions were completed "
                  "over the two recent editing passes; 49 native footnotes now exist in the document. "
                  "In particular the two quotations of Qur'an 13:24 were moved in full into native "
                  "footnotes using green (#38761D) Amiri verse text, flipped English brackets and citations, "
                  "and their genuine page-bottom placement was checked in the Google Docs PDF export "
                  "(English PDF pages 245 and 341). This is partial editor/formatting progress, NOT proof "
                  "of translated source pages 231–298. Source-verified translation remains 230/298; "
                  "keep status In Progress. Full line-by-line Arabic comparison for the 68 remaining "
                  "pages, all source notes, complete first-pass Translator Profile, native target TOC, "
                  "dynamic pagination, rendered book-wide QA and human review are OPEN. "
                  "Do not certify or advance the progress marker without those source-page checks."
              )
              payload=json.dumps({"notes":original+"\n\n"+addition},ensure_ascii=False).encode("utf-8")
              req=urllib.request.Request(url,data=payload,method="PATCH",
                  headers={"content-type":"application/json","x-workbench-actor":"System","user-agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/125.0.0.0 Safari/537.36","accept":"application/json","referer":"https://haydari-translation-workbench.pages.dev/","origin":"https://haydari-translation-workbench.pages.dev"})
              with urllib.request.urlopen(req,timeout=30) as resp:
                  updated=json.load(resp)["project"]
              if marker not in (updated.get("notes") or ""):
                  raise RuntimeError("Checkpoint write not observed")
              if updated.get("translated_pages") != 230 or updated.get("status") != "in_progress":
                  raise RuntimeError("Progress or status unexpectedly mutated")
              print("Verified Workbench checkpoint appended. Project 11 remains 230/298 and In Progress.")
          PY