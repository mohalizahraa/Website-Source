name: Hajj source-checked checkpoint 259 sync
on:
  push:
    branches: [workbench]
    paths: [.github/workflows/hajj-259-sync-once.yml]
permissions: {contents: read}
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Synchronize verified Google Doc progress marker
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,json
          url="https://haydari-translation-workbench.pages.dev/api/projects/11"
          h={"user-agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/125.0.0.0 Safari/537.36","accept":"application/json","content-type":"application/json","origin":"https://haydari-translation-workbench.pages.dev","referer":"https://haydari-translation-workbench.pages.dev/","x-workbench-actor":"System"}
          def get():
            with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=20) as r: return json.load(r)["project"]
          p=get()
          if p["id"]!=11 or p["pages"]!=298 or p["translated_pages"] not in (247,259) or p["status"]!="in_progress": raise RuntimeError("Unexpected live state")
          if p["translated_pages"]==247:
            req=urllib.request.Request(url+"/progress-sync",data=b"{}",method="POST",headers=h)
            with urllib.request.urlopen(req,timeout=30) as r: json.load(r)
          p=get()
          if p["translated_pages"]!=259: raise RuntimeError("Marker sync did not advance to 259")
          m="[2026-10-08 HAJJ PAGES 248-259 SOURCE CHECKPOINT]"
          if m not in (p.get("notes") or ""):
            text=" Original Arabic source pages 248-259 visually checked, repaired omitted Imam al-Husayn Arafah invocation pp. 248-250 in full, and checked concluding prayer with Ibn Tawus appended passages plus the compiler's Arafah counsel. Physical source verified through 259/298; 39 pages remain to check. Formatting, full Qur'anic footnote coverage, native TOC, dynamic pagination, rendered QA and human review remain OPEN. Status In Progress; do not mark as complete."
            req=urllib.request.Request(url,data=json.dumps({"notes":(p.get("notes") or "")+"\n\n"+m+text},ensure_ascii=False).encode(),method="PATCH",headers=h)
            with urllib.request.urlopen(req,timeout=30) as r: json.load(r)
          p=get()
          if p["translated_pages"]!=259 or p["status"]!="in_progress" or m not in (p.get("notes") or ""): raise RuntimeError("Live checkpoint verification failed")
          print("SUCCESS: Rites of Hajj source checkpoint 259/298 In Progress")
          PY