name: Verify Hajj Workbench 247-page checkpoint
on:
  push:
    branches: [workbench]
    paths:
      - .github/workflows/hajj-247-update-once.yml
permissions: {contents: read}
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Apply verified native-document progress marker and note
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request
          base="https://haydari-translation-workbench.pages.dev/api/projects/11"
          h={"user-agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/125.0.0.0 Safari/537.36","accept":"application/json","content-type":"application/json","origin":"https://haydari-translation-workbench.pages.dev","referer":"https://haydari-translation-workbench.pages.dev/","x-workbench-actor":"System"}
          def read():
              with urllib.request.urlopen(urllib.request.Request(base,headers=h),timeout=25) as resp:
                  return json.load(resp)["project"]
          p=read()
          if p["pages"] != 298 or p["id"]!=11 or p["status"]!="in_progress" or p["translated_pages"] not in (242,247):
              raise RuntimeError("Unexpected live state, refusing to update")
          if p["translated_pages"]==242:
              req=urllib.request.Request(base+"/progress-sync",data=b"{}",method="POST",headers=h)
              with urllib.request.urlopen(req,timeout=30) as resp: json.load(resp)
          p=read()
          if p["translated_pages"]!=247: raise RuntimeError("Progress marker not synchronized")
          marker="[2026-10-08 HAJJ SOURCE PAGES 243-247 CHECKED]"
          if marker not in (p.get("notes") or ""):
              addition=" Source pages 243-247 of the Imam al-Husayn Arafah prayer were compared visually to the English source; a missing text passage continuing through physical pages 248-250 was restored as full English working translation and formatted in Amiri. Pages 248-250 and onward are NOT source-verified yet. Source checkpoint 247/298, 51 remaining. The entire translation and all first-pass formatting including native Quran footnotes, TOC, page numbers, rendered checks and human review remain OPEN. No completion claim."
              body=json.dumps({"notes":(p.get("notes") or "")+"\n\n"+marker+addition},ensure_ascii=False).encode()
              req=urllib.request.Request(base,data=body,method="PATCH",headers=h)
              with urllib.request.urlopen(req,timeout=30) as resp: json.load(resp)
          result=read()
          if result["translated_pages"]!=247 or result["status"]!="in_progress" or marker not in (result.get("notes") or ""):
              raise RuntimeError("Readback mismatch")
          print("SUCCESS: Project 11 247/298 and In Progress; notes updated")
          PY