name: Publish Hajj verified pages through 238 (one-time)
on:
  push:
    branches: [workbench]
    paths:
      - .github/workflows/hajj-progress-238-once.yml
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Sync source-verified page marker then append editorial note
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,json
          base="https://haydari-translation-workbench.pages.dev/api/projects/11"
          h={"user-agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/125.0.0.0 Safari/537.36",
             "accept":"application/json","content-type":"application/json",
             "referer":"https://haydari-translation-workbench.pages.dev/",
             "origin":"https://haydari-translation-workbench.pages.dev",
             "x-workbench-actor":"System"}
          def get():
              with urllib.request.urlopen(urllib.request.Request(base,headers=h),timeout=20) as r:
                  return json.load(r)["project"]
          p=get()
          if p["id"]!=11 or p["pages"]!=298 or p["translated_pages"] not in (232,238) or p["status"]!="in_progress":
              raise RuntimeError("Unexpected source denominator/status/progress; refusing write")
          if p["translated_pages"]==232:
              req=urllib.request.Request(base+"/progress-sync",data=b"{}",method="POST",headers=h)
              with urllib.request.urlopen(req,timeout=30) as r: json.load(r)
          p=get()
          if p["translated_pages"]!=238 or p["status"]!="in_progress":
              raise RuntimeError("Progress did not match the verified source checkpoint 238/298")
          marker="[2026-10-08 HAJJ SOURCE PAGES 231-238 VERIFIED]"
          if marker not in (p.get("notes") or ""):
              new=(p.get("notes") or "")+"\n\n"+marker+(
              " Authoritative original PDF (SHA-256 5e0a7395a4a439e493d647d95a2d58680880b27bc5e5043a16392c9b992c3c04) "
              "recovered as physical source. Page 231 Conclusion title is represented with English H1/H2; page 232 is intentionally "
              "blank; printed/physical pages 233-238 of the Night of Arafah devotional text were compared with the English draft. "
              "Missing 'Second' recommended action after obligatory Asr, outdoors, with acknowledgement of sins before proceeding "
              "to Arafah supplications was restored. Qur'an 21:69 was moved to a native green page-bottom footnote with correct "
              "Quran reference; the rendered PDF verified note placement. Checkpoint now 238/298, 60 source pages remain for "
              "full Arabic-unit/source-note comparison before complete Translator Profile and final human review. "
              "Status remains In Progress; no completion or publication claim."
              )
              req=urllib.request.Request(base,data=json.dumps({"notes":new},ensure_ascii=False).encode("utf-8"),
                 method="PATCH",headers=h)
              with urllib.request.urlopen(req,timeout=30) as r: json.load(r)
          final=get()
          if marker not in (final.get("notes") or "") or final["translated_pages"]!=238 or final["status"]!="in_progress":
              raise RuntimeError("Failed to read back durable checkpoint")
          print("VERIFIED live Workbench project 11: 238/298, In Progress, updated notes")
          PY