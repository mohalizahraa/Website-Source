name: Workbench verify

on:
  push:
    branches: [workbench]
    paths:
      - "workbench/**"
      - ".github/workflows/workbench-verify.yml"
  pull_request:
    paths:
      - "workbench/**"
      - ".github/workflows/workbench-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workbench-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax and contract checks
        run: npm --prefix workbench run check
