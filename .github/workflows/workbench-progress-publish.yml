name: Workbench verified progress publisher

on:
  push:
    branches:
      - workbench
    paths:
      - .github/workflows/workbench-progress-publish.yml
      - workbench/progress-publish-request.json

permissions:
  contents: read

concurrency:
  group: workbench-progress-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Check out request
        uses: actions/checkout@v4

      - name: Publish verified progress checkpoint
        shell: bash
        run: |
          set -euo pipefail
          base='https://haydari-translation-workbench.pages.dev'
          request_file='workbench/progress-publish-request.json'

          project_id="$(node -e "const r=require('./workbench/progress-publish-request.json'); process.stdout.write(String(r.project_id))")"
          translated_pages="$(node -e "const r=require('./workbench/progress-publish-request.json'); process.stdout.write(String(r.translated_pages))")"
          google_doc_revision="$(node -e "const r=require('./workbench/progress-publish-request.json'); process.stdout.write(String(r.google_doc_revision||''))")"
          verification_note="$(node -e "const r=require('./workbench/progress-publish-request.json'); process.stdout.write(String(r.verification_note||''))")"

          case "$project_id" in ''|*[!0-9]*) echo "Invalid project_id" >&2; exit 1 ;; esac
          case "$translated_pages" in ''|*[!0-9]*) echo "Invalid translated_pages" >&2; exit 1 ;; esac
          test -n "$google_doc_revision"

          project_json="$(curl -sS --fail --max-time 30 "$base/api/projects/$project_id")"
          expected_previous="$(PROJECT_JSON="$project_json" node -e "const j=JSON.parse(process.env.PROJECT_JSON); process.stdout.write(String(j.project.translated_pages||0))")"
          source_total_pages="$(PROJECT_JSON="$project_json" node -e "const j=JSON.parse(process.env.PROJECT_JSON); process.stdout.write(String(j.project.pages||0))")"

          pdf="$RUNNER_TEMP/workbench-progress-source-$project_id.pdf"
          curl -L --fail --retry 3 --retry-delay 2 --max-time 120 "$base/api/pdf/$project_id" -o "$pdf"
          test "$(head -c 4 "$pdf")" = '%PDF'
          source_pdf_sha256="$(shasum -a 256 "$pdf" | awk '{print $1}')"

          payload="$(TRANSLATED="$translated_pages" PREVIOUS="$expected_previous" TOTAL="$source_total_pages" HASH="$source_pdf_sha256" REV="$google_doc_revision" NOTE="$verification_note" node <<'NODE'
          const payload = {
            translated_pages: Number(process.env.TRANSLATED),
            expected_previous_pages: Number(process.env.PREVIOUS),
            source_total_pages: Number(process.env.TOTAL),
            source_pdf_sha256: process.env.HASH,
            google_doc_revision: process.env.REV,
            verification_note: process.env.NOTE,
          };
          process.stdout.write(JSON.stringify(payload));
          NODE
          )"

          response="$(curl -sS --fail-with-body --max-time 30 \
            -X PATCH "$base/api/projects/$project_id/progress" \
            -H 'content-type: application/json' \
            -H 'x-workbench-actor: Zahraa' \
            --data "$payload")"

          RESPONSE="$response" TARGET="$translated_pages" node <<'NODE'
          const response = JSON.parse(process.env.RESPONSE);
          const target = Number(process.env.TARGET);
          if (Number(response.project?.translated_pages) !== target) {
            throw new Error('Progress readback mismatch: expected ' + target + ', got ' + response.project?.translated_pages);
          }
          console.log(JSON.stringify({
            project_id: response.project.id,
            translated_pages: response.project.translated_pages,
            total_pages: response.project.pages,
            status: response.project.status,
            checkpoint_id: response.checkpoint?.id ?? null,
          }, null, 2));
          NODE

          context="$(curl -sS --fail --max-time 30 "$base/api/projects/$project_id/translation-context")"
          CONTEXT="$context" TARGET="$translated_pages" node <<'NODE'
          const response = JSON.parse(process.env.CONTEXT);
          const target = Number(process.env.TARGET);
          const progress = response.translation_context?.progress;
          if (Number(progress?.stored_translated_pages) !== target ||
              Number(progress?.effective_translated_pages) !== target) {
            throw new Error('Live Workbench context mismatch after publish: ' + JSON.stringify(progress));
          }
          console.log('Verified live Workbench checkpoint:', target);
          NODE
