name: Hajj verified 232-page Workbench sync (one-time)
on:
  push:
    branches: [workbench]
    paths:
      - .github/workflows/hajj-progress-sync-once.yml
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Publish verified target marker 232 via Workbench progress contract
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,json
          base="https://haydari-translation-workbench.pages.dev/api/projects/11"
          h={"user-agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/125.0.0.0 Safari/537.36",
             "accept":"application/json","content-type":"application/json",
             "referer":"https://haydari-translation-workbench.pages.dev/",
             "origin":"https://haydari-translation-workbench.pages.dev",
             "x-workbench-actor":"System"}
          with urllib.request.urlopen(urllib.request.Request(base,headers=h),timeout=20) as resp:
              p=json.load(resp)["project"]
          if p["id"]!=11 or p["pages"]!=298 or p["translated_pages"] not in (230,232):
              raise RuntimeError("Unexpected source denominator or progress; abort")
          if p["translated_pages"]==232:
              print("Already synchronized: 232 of 298"); quit()
          endpoint=base+"/progress-sync"
          req=urllib.request.Request(endpoint,data=b"{}",method="POST",headers=h)
          with urllib.request.urlopen(req,timeout=30) as resp:
              result=json.load(resp)
          with urllib.request.urlopen(urllib.request.Request(base,headers=h),timeout=20) as resp:
              after=json.load(resp)["project"]
          if after["translated_pages"]!=232 or after["pages"]!=298 or after["status"]!="in_progress":
              raise RuntimeError("Progress synchronization did not reach exact verified checkpoint: "+str(after["translated_pages"]))
          print("VERIFIED: Workbench source-page progress 232 / 298, In Progress")
          PY