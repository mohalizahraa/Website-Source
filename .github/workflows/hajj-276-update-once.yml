name: Hajj source checked through page 276
on:
  push:
    branches: [workbench]
    paths: [.github/workflows/hajj-276-update-once.yml]
permissions: {contents: read}
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Publish 276-page native marker and source verification notes
        run: |
          python3 - <<'PY'
          import urllib.request,json
          base="https://haydari-translation-workbench.pages.dev/api/projects/11"
          h={"user-agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/125.0.0.0 Safari/537.36","accept":"application/json","content-type":"application/json","origin":"https://haydari-translation-workbench.pages.dev","referer":"https://haydari-translation-workbench.pages.dev/","x-workbench-actor":"System"}
          def get():
            with urllib.request.urlopen(urllib.request.Request(base,headers=h),timeout=20) as r:return json.load(r)["project"]
          p=get()
          if p["id"]!=11 or p["pages"]!=298 or p["status"]!="in_progress" or p["translated_pages"] not in (265,276):raise RuntimeError("Unexpected project or progress")
          if p["translated_pages"]==265:
            with urllib.request.urlopen(urllib.request.Request(base+"/progress-sync",data=b"{}",method="POST",headers=h),timeout=30) as r:json.load(r)
          p=get()
          if p["translated_pages"]!=276:raise RuntimeError("Doc marker not synchronized")
          marker="[2026-10-08 HAJJ SOURCE PAGES 266-276 VERIFIED]"
          if marker not in (p.get("notes") or ""):
            added=" English source edition checked through Arabic physical page 276. Completed Imam al-Sajjad supplication pp. 266–271, restoring two missing concluding prayers; checked Duaa al-Asharat pp. 272–276 and restored mandated 10-fold Surat al-Ikhlas repetition. Later physical pages 277–291 inspected and several independent textual defects repaired, but these pages remain unverified pending full source-note/quotation collation. End matter 292–298 previously checked independently. 276 of 298 source pages now verified; 22 consecutive source pages remain. All whole-book first-pass formatting, Qur'anic native footnotes, dynamic TOC/pagination, rendered QA and human review remain OPEN. Project remains In Progress."
            body=json.dumps({"notes":(p.get("notes") or "")+"\n\n"+marker+added},ensure_ascii=False).encode()
            with urllib.request.urlopen(urllib.request.Request(base,data=body,method="PATCH",headers=h),timeout=30) as r:json.load(r)
          p=get()
          if p["translated_pages"]!=276 or p["status"]!="in_progress" or marker not in (p.get("notes") or ""):raise RuntimeError("Readback mismatch")
          print("VERIFIED Workbench Hajj 276 of 298 In Progress")
          PY