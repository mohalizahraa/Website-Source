name: Workbench source access bridge

on:
  push:
    branches:
      - workbench
    paths:
      - .github/workflows/workbench-source-fetch.yml
      - workbench/source-access-request.txt

permissions:
  contents: read

jobs:
  fetch-source:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Check out request
        uses: actions/checkout@v4

      - name: Resolve requested Workbench project
        id: request
        shell: bash
        run: |
          set -euo pipefail
          project_id="$(sed -n '1p' workbench/source-access-request.txt | tr -d '[:space:]')"
          case "$project_id" in
            ''|*[!0-9]*) echo "Invalid Workbench project id: $project_id" >&2; exit 1 ;;
          esac
          test "$project_id" -gt 0
          echo "project_id=$project_id" >> "$GITHUB_OUTPUT"

      - name: Download canonical PDF through Workbench
        id: fetch
        shell: bash
        env:
          PROJECT_ID: ${{ steps.request.outputs.project_id }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/workbench-source-$PROJECT_ID.pdf"
          url="https://haydari-translation-workbench.pages.dev/api/pdf/$PROJECT_ID"
          curl -L --fail --retry 3 --retry-delay 2 --max-time 120 "$url" -o "$out"
          size="$(wc -c < "$out" | tr -d ' ')"
          test "$size" -gt 1000
          test "$size" -lt 104857600
          test "$(head -c 4 "$out")" = '%PDF'
          sha256="$(shasum -a 256 "$out" | awk '{print $1}')"
          echo "file=$out" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "Verified Workbench PDF for project $PROJECT_ID: $size bytes"
          echo "SHA-256: $sha256"
          if command -v pdfinfo >/dev/null 2>&1; then
            pdfinfo "$out" | grep -E '^(Pages|Page size|File size):' || true
          fi

      - name: Hand off canonical Workbench PDF
        uses: actions/upload-artifact@v4
        with:
          name: workbench-source-pdf
          path: ${{ steps.fetch.outputs.file }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
