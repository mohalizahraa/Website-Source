name: Workbench source handoff

on:
  push:
    branches:
      - workbench
    paths:
      - .github/workflows/workbench-source-fetch.yml

permissions:
  contents: read

jobs:
  fetch-source:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Download and verify authoritative Tawbah PDF
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/tawbah-source.pdf"
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://archive.alhaydari.com/ebook/ar/%D9%83%D8%AA%D8%A8-%D8%A7%D9%84%D8%A3%D8%AE%D9%84%D8%A7%D9%82/%D8%A7%D9%84%D8%AA%D9%88%D8%A8%D8%A9-%D8%AD%D9%82%D9%8A%D9%82%D8%AA%D9%87%D8%A7-%D9%88%D8%B4%D8%B1%D9%88%D8%B7%D9%87%D8%A7-%D9%88%D8%A2%D8%AB%D8%A7%D8%B1%D9%87%D8%A7.pdf' \
            -o "$out"
          size="$(wc -c < "$out" | tr -d ' ')"
          test "$size" -gt 100000
          test "$size" -lt 2097152
          test "$(head -c 4 "$out")" = '%PDF'
          echo "Verified Tawbah PDF: $size bytes"

      - name: Hand off source artifact
        uses: actions/upload-artifact@v4
        with:
          name: tawbah-source
          path: ${{ runner.temp }}/tawbah-source.pdf
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
