name: Operator Status Repository Pulse

on:
  workflow_dispatch:
  push:
    branches: [main]
  workflow_run:
    workflows: ["temp-snazzy-thum-parented-embed-test"]
    types: [requested, in_progress, completed]

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: operator-status-repo-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      STATUS_URL: https://operator-status.vercel.app/api/status
      PROJECT_ID: website-source
      PROJECT_NAME: "Website Source"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Publish repository and runner state
        shell: bash
        run: |
          set -euo pipefail
          oidc="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=operator-status" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"

          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            run_id="${{ github.event.workflow_run.id }}"
            jobs="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100")"
            export JOBS_JSON="$jobs"
            export RUN_NAME="${{ github.event.workflow_run.name }}"
            export RUN_STATUS="${{ github.event.workflow_run.status }}"
            export RUN_CONCLUSION="${{ github.event.workflow_run.conclusion }}"
            export RUN_BRANCH="${{ github.event.workflow_run.head_branch }}"
            export RUN_SHA="${{ github.event.workflow_run.head_sha }}"
            python3 - <<'PY' > "$RUNNER_TEMP/status.json"
          import json, os, re
          jobs=json.loads(os.environ["JOBS_JSON"]).get("jobs",[])
          status=os.environ.get("RUN_STATUS","")
          conclusion=os.environ.get("RUN_CONCLUSION","")
          state="queued" if status=="queued" else "running" if status=="in_progress" else "failed" if conclusion in {"failure","timed_out","action_required","startup_failure"} else "paused" if conclusion=="cancelled" else "complete"
          completed=sum(1 for j in jobs if j.get("status")=="completed")
          runners=sorted({j.get("runner_name") for j in jobs if j.get("runner_name")})
          current=[j.get("name") for j in jobs if j.get("status")=="in_progress" and j.get("name")]
          slug=re.sub(r"[^a-z0-9._-]+","-",os.environ["RUN_NAME"].lower()).strip("-") or "workflow"
          print(json.dumps({
            "workstreamId":"workflow-"+slug,
            "projectName":os.environ["PROJECT_NAME"],
            "title":os.environ["RUN_NAME"],
            "kind":"workflow",
            "parentWorkstreamId":"repo-pulse",
            "expectedUpdateSeconds":30,
            "state":state,
            "progress":{"kind":"exact","completed":completed,"total":len(jobs)} if jobs else {"kind":"unknown"},
            "current":", ".join(current) if current else "Workflow "+status,
            "runner":" · ".join(runners) if runners else "GitHub Actions",
            "branch":os.environ.get("RUN_BRANCH"),
            "commit":os.environ.get("RUN_SHA"),
            "verification":{"status":conclusion or status,"label":"run "+os.environ.get("GITHUB_RUN_ID","")}
          }))
          PY
          else
            python3 - <<'PY' > "$RUNNER_TEMP/status.json"
          import json, os
          print(json.dumps({
            "workstreamId":"repo-pulse",
            "projectName":os.environ["PROJECT_NAME"],
            "title":"Repository",
            "kind":"task",
            "state":"idle",
            "progress":{"kind":"unknown"},
            "current":"Repository synchronized; no active runner work observed",
            "runner":"GitHub Actions",
            "branch":os.environ.get("GITHUB_REF_NAME"),
            "commit":os.environ.get("GITHUB_SHA"),
            "verification":{"status":"connected","label":"repository telemetry connected"}
          }))
          PY
          fi

          curl --fail-with-body --silent --show-error --retry 5 \
            -X POST "$STATUS_URL" \
            -H "Authorization: Bearer $oidc" \
            -H "x-vercel-trusted-oidc-idp-token: $oidc" \
            -H "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/status.json"
