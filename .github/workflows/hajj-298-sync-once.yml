name: Hajj final source-page checkpoint sync (one-time)
on:
  push:
    branches: [workbench]
    paths: [.github/workflows/hajj-298-sync-once.yml]
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Publish Hajj 298/298 source-page evidence, preserving formatting-open gates
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request
          base="https://haydari-translation-workbench.pages.dev/api/projects/11"
          h={"user-agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/125.0.0.0 Safari/537.36",
             "accept":"application/json","content-type":"application/json","x-workbench-actor":"System",
             "referer":"https://haydari-translation-workbench.pages.dev/",
             "origin":"https://haydari-translation-workbench.pages.dev"}
          def get(path=""):
              with urllib.request.urlopen(urllib.request.Request(base+path,headers=h),timeout=25) as r:return json.load(r)
          p=get()["project"]
          if p["id"]!=11 or p["pages"]!=298 or p["translated_pages"]>298 or p["translated_pages"]<276:
              raise RuntimeError("Unexpected live project state, abort")
          marker=get("/progress-sync")
          if not marker.get("marker_found") or marker.get("marker_pages")!=298 or marker.get("marker_total")!=298:
              raise RuntimeError("Google Docs target does not contain exact final source-page marker")
          if p["translated_pages"]<298:
              req=urllib.request.Request(base+"/progress-sync",method="POST",data=b"{}",headers=h)
              with urllib.request.urlopen(req,timeout=35) as r:print("progress-sync response",json.load(r).get("marker_pages"))
          p=get()["project"]
          if p["translated_pages"]!=298 or p["pages"]!=298:raise RuntimeError("Checkpoint not persisted")
          note="[2026-10-09 HAJJ SOURCE PAGES 1-298 ACCOUNTED — EDITION FORMATTING OPEN]"
          if note not in (p.get("notes") or ""):
              payload={"notes":(p.get("notes") or "")+"\n\n"+note+" The English Google Doc has passed contiguous source-page comparison through the 298-page canonical Arabic PDF (SHA256 5e0a7395a4a439e493d647d95a2d58680880b27bc5e5043a16392c9b992c3c04). Final pages 292-298 (printed publisher catalogue items 1-115) checked visually against all numbered English entries, with author/grouping divisions and entry 16 corrected to 'perfection of the religious laws'. This is a source-page ACCOUNTING checkpoint ONLY. Original source-note fidelity, full native Qur'anic-footnote relocation, ALL REAL SCALE v2/Translator Profile formatting criteria, native linked table of contents, dynamic page numbers, complete PDF visual QA and human review remain OPEN. Never mark Completed or Published from source page count alone."}
              req=urllib.request.Request(base,method="PATCH",data=json.dumps(payload,ensure_ascii=False).encode("utf-8"),headers=h)
              with urllib.request.urlopen(req,timeout=30) as r:json.load(r)
          p=get()["project"]
          if p["translated_pages"]!=298 or note not in (p["notes"] or ""):raise RuntimeError("Readback mismatch")
          print("WORKBENCH VERIFIED",p["translated_pages"],"/",p["pages"],"STATUS",p["status"],"FORMATTING OPEN")
          PY