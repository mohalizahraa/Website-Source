name: Hajj checked source checkpoint 265 sync (one-time)
on:
  push:
    branches: [workbench]
    paths: [.github/workflows/hajj-265-sync-once.yml]
permissions: {contents: read}
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Publish verified 265-page marker and evidence to Workbench
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,json
          url="https://haydari-translation-workbench.pages.dev/api/projects/11"
          h={"user-agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/125.0.0.0 Safari/537.36","accept":"application/json","content-type":"application/json","origin":"https://haydari-translation-workbench.pages.dev","referer":"https://haydari-translation-workbench.pages.dev/","x-workbench-actor":"System"}
          def read():
             with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=20) as r:return json.load(r)["project"]
          p=read()
          if p["pages"]!=298 or p["id"]!=11 or p["status"]!="in_progress" or p["translated_pages"] not in (259,265): raise RuntimeError("Unexpected checkpoint/status")
          if p["translated_pages"]==259:
             with urllib.request.urlopen(urllib.request.Request(url+"/progress-sync",data=b"{}",method="POST",headers=h),timeout=30) as r:json.load(r)
          p=read()
          if p["translated_pages"]!=265:raise RuntimeError("Did not reach 265")
          marker="[2026-10-08 HAJJ PAGES 260-265 SOURCE CHECKPOINT]"
          if marker not in (p.get("notes") or ""):
             n=" Source pages 260-265 of Imam al-Sajjad's Arafah prayer visually compared with the English and a duplicate parallel-text summary removed. Later separate checks corrected non-source Du'a al-Asharat introduction and restored the recitation of Surat al-Ikhlas ten times at Arabic page 276. Arabic printed catalogue pages 292-298 independently aligned with English entries 1-115. These independent checks do not make intervening pages source-verified. Contiguous source progress is 265/298; 33 physical pages remain. Complete first-pass formatting, native Quran footnotes, table of contents, pagination, rendered QA and human review are all OPEN. Keep project In Progress."
             b=json.dumps({"notes":(p.get("notes") or "")+"\n\n"+marker+n},ensure_ascii=False).encode()
             with urllib.request.urlopen(urllib.request.Request(url,data=b,method="PATCH",headers=h),timeout=30) as r:json.load(r)
          p=read()
          if p["status"]!="in_progress" or p["translated_pages"]!=265 or marker not in (p.get("notes") or ""):raise RuntimeError("Live readback failed")
          print("SUCCESS 265/298 In Progress")
          PY